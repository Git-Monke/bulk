<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Conversation View</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #0f0f12;
      --bg-secondary: #1a1a1f;
      --bg-tertiary: #252530;
      --bg-hover: #2a2a35;
      
      --text-primary: #e8e8ed;
      --text-secondary: #9898a4;
      --text-muted: #6b6b78;
      
      --accent-user: #f59e0b;
      --accent-user-bg: rgba(245, 158, 11, 0.12);
      --accent-agent: #6366f1;
      --accent-agent-bg: rgba(99, 102, 241, 0.12);
      --accent-tool: #a855f7;
      --accent-tool-bg: rgba(168, 85, 247, 0.1);
      --accent-tool-border: rgba(168, 85, 247, 0.25);
      
      --border-subtle: rgba(255, 255, 255, 0.06);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: var(--spacing-lg);
      line-height: 1.5;
    }

    .conversation-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
    }

    .conversation-header {
      padding: var(--spacing-md) var(--spacing-lg);
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .conversation-header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .conversation-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .messages-list {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeSlideIn 0.3s ease-out;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.agent,
    .message.tool-cluster {
      align-self: flex-start;
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-xs);
      padding: 0 var(--spacing-xs);
    }

    .message-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .message.user .message-avatar {
      background: var(--accent-user);
      color: #000;
    }

    .message.agent .message-avatar {
      background: var(--accent-agent);
      color: #fff;
    }

    .message.tool-cluster .message-avatar {
      background: var(--accent-tool);
      color: #fff;
    }

    .message-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .message-time {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .message-bubble {
      padding: var(--spacing-md);
      border-radius: var(--radius-lg);
      position: relative;
    }

    .message.user .message-bubble {
      background: var(--accent-user-bg);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-top-right-radius: var(--radius-sm);
    }

    .message.agent .message-bubble {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-top-left-radius: var(--radius-sm);
    }

    .message.tool-cluster .message-bubble {
      background: var(--accent-tool-bg);
      border: 1px solid var(--accent-tool-border);
      border-top-left-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .message.tool-cluster .message-bubble:hover {
      background: rgba(168, 85, 247, 0.15);
    }

    .tool-cluster-header {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-xs);
    }

    .tool-icon {
      width: 18px;
      height: 18px;
      color: var(--accent-tool);
    }

    .tool-cluster-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--accent-tool);
    }

    .tool-count-badge {
      font-size: 0.7rem;
      background: rgba(168, 85, 247, 0.2);
      color: var(--accent-tool);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }

    .tool-expand-icon {
      margin-left: auto;
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    .tool-cluster.expanded .tool-expand-icon {
      transform: rotate(180deg);
    }

    .tool-details {
      display: none;
      margin-top: var(--spacing-md);
      padding-top: var(--spacing-md);
      border-top: 1px solid var(--accent-tool-border);
    }

    .tool-cluster.expanded .tool-details {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .tool-entry {
      padding: var(--spacing-sm) var(--spacing-md);
      background: rgba(0, 0, 0, 0.3);
      border-radius: var(--radius-sm);
      margin-bottom: var(--spacing-sm);
    }

    .tool-entry:last-child {
      margin-bottom: 0;
    }

    .tool-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: var(--spacing-xs);
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }

    .tool-name::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--accent-tool);
      border-radius: 50%;
    }

    .tool-params {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: rgba(0, 0, 0, 0.2);
      padding: var(--spacing-sm);
      border-radius: var(--radius-sm);
      overflow-x: auto;
    }

    .tool-result {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: var(--spacing-xs);
      font-style: italic;
    }

    .message-content {
      font-size: 0.9rem;
      color: var(--text-primary);
      white-space: pre-wrap;
    }

    .message.agent .message-content code,
    .message.user .message-content code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.85em;
    }

    .message-content p {
      margin-bottom: var(--spacing-sm);
    }

    .message-content p:last-child {
      margin-bottom: 0;
    }

    /* Typing indicator for agent */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: var(--spacing-sm) 0;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(1) { animation-delay: 0s; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 80%, 100% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="conversation-container">
    <header class="conversation-header">
      <h1>Conversation</h1>
      <span class="conversation-meta">pi coding agent</span>
    </header>
    
    <div class="messages-list" id="messagesList">
      <!-- Messages will be rendered here -->
    </div>
  </div>

  <script>
    // Sample conversation data with consecutive tool calls
    const conversationData = [
      {
        type: 'user',
        content: 'Help me build a simple counter component with HTML, CSS, and JavaScript.',
        timestamp: '2026-05-04T10:30:00'
      },
      {
        type: 'agent',
        content: "I'll build a clean counter component for you. Let me start by creating the HTML structure, then add the styling and interactivity.",
        timestamp: '2026-05-04T10:30:02'
      },
      {
        type: 'tool_call',
        toolName: 'write',
        params: {
          path: 'counter.html',
          content: '<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <title>Counter</title>\n  <link rel="stylesheet" href="counter.css">\n</head>\n<body>\n  <div class="counter">\n    <button id="decrement">−</button>\n    <span id="count">0</span>\n    <button id="increment">+</button>\n  </div>\n  <script src="counter.js"><\/script>\n</body>\n</html>'
        },
        result: 'File written successfully (247 bytes)',
        timestamp: '2026-05-04T10:30:03'
      },
      {
        type: 'tool_call',
        toolName: 'write',
        params: {
          path: 'counter.css',
          content: '.counter {\n  display: flex;\n  align-items: center;\n  gap: 16px;\n  font-family: system-ui;\n}\n\nbutton {\n  width: 40px;\n  height: 40px;\n  border: none;\n  border-radius: 8px;\n  background: #6366f1;\n  color: white;\n  font-size: 24px;\n  cursor: pointer;\n}\n\n#count {\n  font-size: 32px;\n  font-weight: bold;\n  min-width: 60px;\n  text-align: center;\n}'
        },
        result: 'File written successfully (312 bytes)',
        timestamp: '2026-05-04T10:30:04'
      },
      {
        type: 'tool_call',
        toolName: 'write',
        params: {
          path: 'counter.js',
          content: "const countEl = document.getElementById('count');\nconst incBtn = document.getElementById('increment');\nconst decBtn = document.getElementById('decrement');\n\nlet count = 0;\n\nincBtn.addEventListener('click', () => {\n  count++;\n  countEl.textContent = count;\n});\n\ndecBtn.addEventListener('click', () => {\n  count--;\n  countEl.textContent = count;\n});"
        },
        result: 'File written successfully (289 bytes)',
        timestamp: '2026-05-04T10:30:05'
      },
      {
        type: 'agent',
        content: "I've created three files for your counter component:\n\n- **counter.html** — the markup with a decrement button, display, and increment button\n- **counter.css** — styles for the flexbox layout and button appearance\n- **counter.js** — the event listeners that update the count\n\nThe component uses a simple increment/decrement pattern with clean visuals. Open `counter.html` in your browser to try it out!",
        timestamp: '2026-05-04T10:30:06'
      },
      {
        type: 'user',
        content: 'Can you add a reset button that sets the count back to 0?',
        timestamp: '2026-05-04T10:31:00'
      },
      {
        type: 'agent',
        content: "Sure, I'll add a reset button to the component.",
        timestamp: '2026-05-04T10:31:01'
      },
      {
        type: 'tool_call',
        toolName: 'read',
        params: {
          path: 'counter.html'
        },
        result: 'File content retrieved (247 bytes)',
        timestamp: '2026-05-04T10:31:02'
      },
      {
        type: 'tool_call',
        toolName: 'edit',
        params: {
          path: 'counter.html',
          oldText: '  <div class="counter">\n    <button id="decrement">−</button>\n    <span id="count">0</span>\n    <button id="increment">+</button>\n  </div>',
          newText: '  <div class="counter">\n    <button id="decrement">−</button>\n    <span id="count">0</span>\n    <button id="increment">+</button>\n    <button id="reset">Reset</button>\n  </div>'
        },
        result: 'File edited successfully',
        timestamp: '2026-05-04T10:31:03'
      },
      {
        type: 'tool_call',
        toolName: 'edit',
        params: {
          path: 'counter.js',
          oldText: 'decBtn.addEventListener(\'click\', () => {\n  count--;\n  countEl.textContent = count;\n});',
          newText: 'decBtn.addEventListener(\'click\', () => {\n  count--;\n  countEl.textContent = count;\n});\n\ndocument.getElementById(\'reset\').addEventListener(\'click\', () => {\n  count = 0;\n  countEl.textContent = count;\n});'
        },
        result: 'File edited successfully',
        timestamp: '2026-05-04T10:31:04'
      },
      {
        type: 'agent',
        content: "Done! I've added a Reset button to the HTML and wired it up in the JavaScript. Refresh your browser to see it in action.",
        timestamp: '2026-05-04T10:31:05'
      }
    ];

    // Group consecutive tool calls
    function groupToolCalls(messages) {
      const grouped = [];
      let toolCluster = [];

      for (const msg of messages) {
        if (msg.type === 'tool_call') {
          toolCluster.push(msg);
        } else {
          if (toolCluster.length > 0) {
            grouped.push({
              type: 'tool_cluster',
              tools: [...toolCluster],
              timestamp: toolCluster[0].timestamp
            });
            toolCluster = [];
          }
          grouped.push(msg);
        }
      }

      // Don't forget any trailing tool calls
      if (toolCluster.length > 0) {
        grouped.push({
          type: 'tool_cluster',
          tools: [...toolCluster],
          timestamp: toolCluster[0].timestamp
        });
      }

      return grouped;
    }

    // Format timestamp to readable time
    function formatTime(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });
    }

    // Get avatar content based on message type
    function getAvatarContent(type) {
      switch (type) {
        case 'user': return 'U';
        case 'agent': return 'A';
        case 'tool_cluster': return '⚙';
      }
    }

    // Get label based on message type
    function getLabel(type) {
      switch (type) {
        case 'user': return 'You';
        case 'agent': return 'Agent';
        case 'tool_cluster': return 'Tool Calls';
      }
    }

    // Render tool details
    function renderToolDetails(tools) {
      return tools.map(tool => `
        <div class="tool-entry">
          <div class="tool-name">${tool.toolName}</div>
          <div class="tool-params">${JSON.stringify(tool.params, null, 2)}</div>
          ${tool.result ? `<div class="tool-result">→ ${tool.result}</div>` : ''}
        </div>
      `).join('');
    }

    // Render a single message
    function renderMessage(msg) {
      const time = formatTime(msg.timestamp);
      const avatar = getAvatarContent(msg.type);
      const label = getLabel(msg.type);

      if (msg.type === 'tool_cluster') {
        const count = msg.tools.length;
        return `
          <div class="message tool-cluster" data-tools="${count}">
            <div class="message-header">
              <div class="message-avatar">${avatar}</div>
              <span class="message-label">${label}</span>
              <span class="tool-count-badge">${count} tool${count > 1 ? 's' : ''}</span>
              <svg class="tool-expand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
            <div class="message-bubble">
              <div class="tool-cluster-header">
                <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                </svg>
                <span class="tool-cluster-label">Agent ran ${count} tool${count > 1 ? 's' : ''}</span>
              </div>
              <div class="tool-details">
                ${renderToolDetails(msg.tools)}
              </div>
            </div>
          </div>
        `;
      }

      const content = msg.content
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');

      return `
        <div class="message ${msg.type}">
          <div class="message-header">
            <div class="message-avatar">${avatar}</div>
            <span class="message-label">${label}</span>
            <span class="message-time">${time}</span>
          </div>
          <div class="message-bubble">
            <div class="message-content">${content}</div>
          </div>
        </div>
      `;
    }

    // Render all messages
    function renderConversation(data) {
      const messagesList = document.getElementById('messagesList');
      const grouped = groupToolCalls(data);
      messagesList.innerHTML = grouped.map(renderMessage).join('');

      // Add click handlers for tool clusters
      document.querySelectorAll('.message.tool-cluster').forEach(cluster => {
        cluster.addEventListener('click', () => {
          cluster.classList.toggle('expanded');
        });
      });
    }

    // Initialize
    renderConversation(conversationData);
  </script>
</body>
</html>
